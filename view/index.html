<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../styles/authstyle.css">
</head>
<body>
    <div class="container">

        <aside class="left">
            <a class="brand-panel-logo" href="index.html" aria-label="Pagina de login">
                <img src="../images/logo extendido.png" alt="Logo E-Commerce Computador">
            </a>
            <div class="brand-panel-copy">
                <span class="eyebrow"><i class="bi bi-pc-display-horizontal" aria-hidden="true"></i> Hardware com suporte inteligente</span>
                <h1>Entre na sua conta</h1>
                <p>Acesse pedidos, carrinho, perfil e recomendacoes de produtos em um ambiente seguro.</p>
            </div>
        </aside>

        <div class="right">

            <div class="login-box">

                <a class="logo site-logo" href="index.html" aria-label="Pagina de login">
                    <img src="../images/logo encurtado.png" alt="Logo E-Commerce Computador">
                </a>

                <div class="input-group">
                    <span class="input-group-text" aria-hidden="true"><i class="bi bi-envelope"></i></span>
                    <input class="form-control" type="email" id="email" placeholder="EMAIL">
                </div>

                <div class="input-group">
                    <span class="input-group-text" aria-hidden="true"><i class="bi bi-lock"></i></span>
                    <input class="form-control" type="password" id="senha" placeholder="SENHA">
                </div>

                <div id="login-message" class="message" role="alert"></div>

                <div class="actions">

                    <button id="login-button" class="btn btn-primary" type="button" data-icon="bi-box-arrow-in-right"><i class="bi bi-box-arrow-in-right" aria-hidden="true"></i><span>ACESSAR</span></button>

                    <button id="forgot-password-button" class="link-button" type="button"><i class="bi bi-question-circle" aria-hidden="true"></i><span>ESQUECEU SENHA</span></button>

                </div>

                <div class="register">
                    <a href="pages/cadastro.html"><i class="bi bi-person-plus" aria-hidden="true"></i><span>NAO TEM CONTA?</span></a>
                </div>

            </div>

        </div>

    </div>

    <div id="forgot-password-modal" class="auth-modal hidden" role="dialog" aria-modal="true" aria-labelledby="forgot-password-title">
        <div class="auth-modal-content">
            <button id="forgot-password-close" class="modal-close" type="button" aria-label="Fechar"><i class="bi bi-x-lg" aria-hidden="true"></i></button>

            <div id="forgot-password-request">
                <h2 id="forgot-password-title"><i class="bi bi-key" aria-hidden="true"></i><span>REDEFINIR SENHA</span></h2>
                <p>Informe o email da sua conta para receber o link de redefinicao.</p>
                <div class="input-group">
                    <span class="input-group-text" aria-hidden="true"><i class="bi bi-envelope"></i></span>
                    <input class="form-control" type="email" id="forgot-password-email" placeholder="EMAIL">
                </div>
                <div id="forgot-password-message" class="message is-visible" role="alert"></div>
                <div class="modal-actions">
                    <button id="forgot-password-cancel" class="btn btn-outline-light" type="button"><i class="bi bi-x-circle" aria-hidden="true"></i><span>CANCELAR</span></button>
                    <button id="forgot-password-submit" class="btn btn-primary" type="button" data-icon="bi-send"><i class="bi bi-send" aria-hidden="true"></i><span>SOLICITAR ALTERACAO</span></button>
                </div>
            </div>

            <div id="forgot-password-confirm" class="hidden">
                <h2><i class="bi bi-envelope-check" aria-hidden="true"></i><span>EMAIL ENVIADO</span></h2>
                <p id="forgot-password-confirm-message"></p>
                <div id="forgot-password-confirm-alert" class="message is-visible" role="alert"></div>
                <div class="modal-actions">
                    <button id="forgot-password-yes" class="btn btn-primary" type="button" data-icon="bi-check2-circle"><i class="bi bi-check2-circle" aria-hidden="true"></i><span>SIM</span></button>
                    <button id="forgot-password-no" class="btn btn-outline-light" type="button" data-icon="bi-arrow-repeat"><i class="bi bi-arrow-repeat" aria-hidden="true"></i><span>NAO, REENVIAR</span></button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="scripts/login.js"></script>
</body>
</html>
