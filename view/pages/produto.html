<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../styles/produto.css">
  <link rel="stylesheet" href="../../styles/mobile-menu.css">
  <link rel="stylesheet" href="../../styles/cart-notice.css">
</head>
<body>
  <div class="produto-shell">
    <header class="produto-header">
      <a class="logo site-logo" href="./home.html" aria-label="Ir para a pagina inicial">
        <img src="../../images/logo encurtado.png" alt="Logo E-Commerce Computador">
      </a>
      <div class="input-group search-group">
        <span class="input-group-text" aria-hidden="true"><i class="bi bi-search"></i></span>
        <input id="produto-search" class="form-control search" type="text" placeholder="Pesquisar produtos">
      </div>
      <button class="mobile-menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="produto-mobile-menu" data-bs-toggle="collapse" data-bs-target="#produto-mobile-menu">
        <i class="bi bi-list" aria-hidden="true"></i>
      </button>
      <nav id="produto-mobile-menu" class="client-nav-menu collapse" aria-label="Menu do cliente">
        <a class="btn nav-action" href="ia.html"><i class="bi bi-stars" aria-hidden="true"></i><span>IA</span></a>
        <button id="perfil-btn" class="btn nav-action" type="button"><i class="bi bi-person-circle" aria-hidden="true"></i><span>Perfil</span></button>
        <button id="btn-carrinho" class="btn nav-action" type="button"><i class="bi bi-cart3" aria-hidden="true"></i><span>Carrinho</span></button>
      </nav>
    </header>

    <main class="produto-main">
      <section class="produto-left">
        <div class="image-panel">
          <div id="main-image" class="main-image"><i class="bi bi-image" aria-hidden="true"></i><span>Imagem do produto</span></div>
          <div id="thumbs" class="thumbs"></div>
        </div>
        <div class="produto-detalhes">
          <h2 class="panel-title"><i class="bi bi-box-seam" aria-hidden="true"></i><span>Detalhes do produto</span></h2>
          <h3 id="produto-nome">NOME</h3>
          <p id="produto-modelo">MODELO</p>
          <p id="produto-marca">MARCA</p>
          <p id="produto-categorias">CATEGORIAS</p>
        </div>
      </section>

      <section class="produto-right">
        <div class="produto-texto" id="produto-texto">
          <h3><i class="bi bi-card-text" aria-hidden="true"></i><span>Descricao tecnica</span></h3>
          <p id="produto-descricao"></p>
          <h3><i class="bi bi-list-check" aria-hidden="true"></i><span>Especificacoes tecnicas</span></h3>
          <p id="produto-especificacoes"></p>
        </div>
        <button id="btn-add-carrinho" class="btn add-cart" type="button"><i class="bi bi-cart-plus" aria-hidden="true"></i><span>Preco - Adicionar ao carrinho</span></button>
      </section>
    </main>

    <div id="produto-message" class="produto-message hidden"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../scripts/produto.js"></script>
</body>
</html>
