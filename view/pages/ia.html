<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gamzu IA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../styles/ia.css">
  <link rel="stylesheet" href="../../styles/mobile-menu.css">
  <link rel="stylesheet" href="../../styles/cart-notice.css">
</head>

<body>
  <div class="ia-shell">
    <header class="ia-header">
      <a class="logo site-logo" href="home.html" aria-label="Ir para a pagina inicial">
        <img src="../../images/logo encurtado.png" alt="Logo E-Commerce Computador">
      </a>
      <div class="ia-title">
        <strong><i class="bi bi-stars" aria-hidden="true"></i><span>Gamzu</span></strong>
        <span>IA para pecas de computador e hardware</span>
      </div>
      <button class="mobile-menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="ia-mobile-menu" data-bs-toggle="collapse" data-bs-target="#ia-mobile-menu">
        <i class="bi bi-list" aria-hidden="true"></i>
      </button>
      <nav id="ia-mobile-menu" class="client-nav-menu collapse" aria-label="Menu do cliente">
        <button id="perfil-btn" class="btn nav-action" type="button"><i class="bi bi-person-circle"
            aria-hidden="true"></i><span>Perfil</span></button>
        <button id="btn-carrinho" class="btn nav-action" type="button"><i class="bi bi-cart3"
            aria-hidden="true"></i><span>Carrinho</span></button>
      </nav>
    </header>

    <main class="chat-panel">
      <div class="chat-topbar">
        <div class="chat-heading">
          <strong><i class="bi bi-chat-dots" aria-hidden="true"></i><span>Conversa com Gamzu</span></strong>
          <p>Envie apenas texto. A Gamzu responde sobre hardware, pecas e compatibilidade.</p>
        </div>
        <button id="btn-nova-conversa" class="btn secondary-action" type="button"><i class="bi bi-arrow-clockwise"
            aria-hidden="true"></i><span>Nova conversa</span></button>
      </div>

      <div id="chat-status" class="chat-status hidden"></div>
      <section id="chat-messages" class="chat-messages" aria-live="polite"></section>

      <form id="chat-form" class="chat-form">
        <div class="input-group chat-input-group">
          <span class="input-group-text" aria-hidden="true"><i class="bi bi-keyboard"></i></span>
          <input id="chat-input" class="form-control" type="text" autocomplete="off"
            placeholder="Pergunte sobre pecas, compatibilidade ou upgrades">
        </div>
        <button id="chat-send" class="btn send-btn" type="submit"><i class="bi bi-send"
            aria-hidden="true"></i><span>Enviar</span></button>
      </form>
    </main>
  </div>

  <div id="ia-confirm-modal" class="ia-modal hidden" role="dialog" aria-modal="true" aria-labelledby="ia-confirm-title">
    <div class="ia-modal-content">
      <button id="ia-confirm-close" class="modal-close" type="button" aria-label="Fechar">
        <i class="bi bi-x-lg" aria-hidden="true"></i>
      </button>
      <h2 id="ia-confirm-title"><i class="bi bi-exclamation-triangle" aria-hidden="true"></i><span>Nova conversa</span></h2>
      <p id="ia-confirm-message"></p>
      <div class="modal-actions">
        <button id="ia-confirm-cancel" class="btn secondary-action" type="button"><i class="bi bi-x-circle"
            aria-hidden="true"></i><span>Cancelar</span></button>
        <button id="ia-confirm-ok" class="btn send-btn" type="button"><i class="bi bi-arrow-clockwise"
            aria-hidden="true"></i><span>Iniciar nova conversa</span></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../scripts/ia.js"></script>
</body>

</html>
