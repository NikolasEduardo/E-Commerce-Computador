<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../styles/home.css">
  <link rel="stylesheet" href="../../styles/mobile-menu.css">
  <link rel="stylesheet" href="../../styles/cart-notice.css">
</head>
<body>
  <div class="home-shell">
    <header class="home-header">
      <a class="logo site-logo" href="./home.html" aria-label="Ir para a pagina inicial">
        <img src="../../images/logo encurtado.png" alt="Logo E-Commerce Computador">
      </a>
      <div class="input-group search-group">
        <span class="input-group-text" aria-hidden="true"><i class="bi bi-search"></i></span>
        <input id="home-search" class="form-control search" type="text" placeholder="Pesquisar produtos">
      </div>
      <button class="mobile-menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="home-mobile-menu" data-bs-toggle="collapse" data-bs-target="#home-mobile-menu">
        <i class="bi bi-list" aria-hidden="true"></i>
      </button>
      <nav id="home-mobile-menu" class="client-nav-menu collapse" aria-label="Menu do cliente">
        <a class="btn nav-action" href="ia.html"><i class="bi bi-stars" aria-hidden="true"></i><span>IA</span></a>
        <button id="perfil-btn" class="btn nav-action" type="button"><i class="bi bi-person-circle" aria-hidden="true"></i><span>Perfil</span></button>
        <button id="btn-carrinho" class="btn nav-action" type="button"><i class="bi bi-cart3" aria-hidden="true"></i><span>Carrinho</span></button>
      </nav>
    </header>

    <section class="categories" aria-label="Categorias principais">
      <button class="cat-btn" type="button" data-category="PROCESSADOR"><i class="bi bi-cpu" aria-hidden="true"></i><span>Processador</span></button>
      <button class="cat-btn" type="button" data-category="PLACA-MAE"><i class="bi bi-motherboard" aria-hidden="true"></i><span>Placa-mae</span></button>
      <button class="cat-btn" type="button" data-category="PLACA DE VIDEO"><i class="bi bi-gpu-card" aria-hidden="true"></i><span>Placa de video</span></button>
      <button class="cat-btn" type="button" data-category="ARMAZENAMENTO"><i class="bi bi-device-ssd" aria-hidden="true"></i><span>Armazenamento</span></button>
      <button class="cat-btn" type="button" data-category="MEMORIA RAM"><i class="bi bi-memory" aria-hidden="true"></i><span>Memoria RAM</span></button>
      <button class="cat-btn" type="button" data-category="FONTE"><i class="bi bi-lightning-charge" aria-hidden="true"></i><span>Fonte</span></button>
    </section>

    <h2 class="section-title"><i class="bi bi-fire" aria-hidden="true"></i><span>Produtos populares</span></h2>

    <section id="productsList" class="products"></section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../scripts/home.js"></script>
</body>
</html>
