<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Busca de Produtos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../styles/busca.css">
  <link rel="stylesheet" href="../../styles/mobile-menu.css">
  <link rel="stylesheet" href="../../styles/cart-notice.css">
</head>
<body>
  <div class="busca-shell">
    <header class="busca-header">
      <a class="logo site-logo" href="./home.html" aria-label="Ir para a pagina inicial">
        <img src="../../images/logo encurtado.png" alt="Logo E-Commerce Computador">
      </a>
      <button class="mobile-menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="busca-mobile-menu" data-bs-toggle="collapse" data-bs-target="#busca-mobile-menu">
        <i class="bi bi-list" aria-hidden="true"></i>
      </button>
      <nav id="busca-mobile-menu" class="client-nav-menu collapse" aria-label="Menu do cliente">
        <a class="btn nav-action" href="ia.html"><i class="bi bi-stars" aria-hidden="true"></i><span>IA</span></a>
        <button id="perfil-btn" class="btn nav-action" type="button"><i class="bi bi-person-circle" aria-hidden="true"></i><span>Perfil</span></button>
        <button id="btn-carrinho" class="btn nav-action" type="button"><i class="bi bi-cart3" aria-hidden="true"></i><span>Carrinho</span></button>
      </nav>
    </header>

    <main class="busca-main">
      <section class="busca-toolbar">
        <div class="input-group search-group">
          <span class="input-group-text" aria-hidden="true"><i class="bi bi-search"></i></span>
          <input id="busca-input" class="form-control busca-input" type="text" placeholder="Pesquisar produtos">
        </div>
        <button class="btn filters-toggle" type="button" aria-expanded="false" aria-controls="filters-panel" data-bs-toggle="collapse" data-bs-target="#filters-panel">
          <i class="bi bi-list" aria-hidden="true"></i><span>Filtros</span>
        </button>
        <div class="sort-panel" aria-label="Classificar produtos">
          <span class="sort-title"><i class="bi bi-arrow-down-up" aria-hidden="true"></i>Classificar por</span>
          <button class="btn sort-button" type="button" data-sort-field="popularidade" data-label="Popularidade" data-icon="bi-fire"><i class="bi bi-fire" aria-hidden="true"></i><span>Popularidade</span></button>
          <button class="btn sort-button" type="button" data-sort-field="preco" data-label="Preco" data-icon="bi-currency-dollar"><i class="bi bi-currency-dollar" aria-hidden="true"></i><span>Preco</span></button>
          <button class="btn sort-button" type="button" data-sort-field="nome" data-label="Nome" data-icon="bi-sort-alpha-down"><i class="bi bi-sort-alpha-down" aria-hidden="true"></i><span>Nome</span></button>
        </div>
      </section>

      <section class="busca-content">
        <aside id="filters-panel" class="filters-panel collapse">
          <h2><i class="bi bi-sliders" aria-hidden="true"></i><span>Filtrar por</span></h2>

          <div class="filter-group">
            <h3><i class="bi bi-grid-3x3-gap" aria-hidden="true"></i><span>Categorias principais</span></h3>
            <div id="main-categories" class="filter-options"></div>
          </div>

          <div class="filter-group">
            <h3><i class="bi bi-tags" aria-hidden="true"></i><span>Outras categorias</span></h3>
            <div id="other-categories" class="filter-options"></div>
          </div>

          <div class="filter-group">
            <h3><i class="bi bi-award" aria-hidden="true"></i><span>Marca</span></h3>
            <select id="marca-filter" class="form-select">
              <option value="">Todas</option>
            </select>
          </div>

          <div class="filter-group">
            <h3><i class="bi bi-cash-coin" aria-hidden="true"></i><span>Faixa de preco</span></h3>
            <div class="price-inputs">
              <label class="price-field">
                <span>Min.</span>
                <input id="preco-min" class="form-control" type="number" min="0" step="0.01" placeholder="0,00">
              </label>
              <label class="price-field">
                <span>Max.</span>
                <input id="preco-max" class="form-control" type="number" min="0" step="0.01" placeholder="0,00">
              </label>
            </div>
            <button id="apply-price" class="btn filter-action" type="button"><i class="bi bi-check2-circle" aria-hidden="true"></i><span>Aplicar preco</span></button>
          </div>

          <button id="clear-filters" class="btn filter-action clear-action" type="button"><i class="bi bi-x-circle" aria-hidden="true"></i><span>Limpar filtros</span></button>
        </aside>

        <section id="resultados-list" class="products-grid"></section>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../scripts/busca.js"></script>
</body>
</html>
