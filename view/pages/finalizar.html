<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finalizar Compra</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../styles/finalizar.css">
  <link rel="stylesheet" href="../../styles/mobile-menu.css">
  <link rel="stylesheet" href="../../styles/cart-notice.css">
</head>
<body>
  <div class="checkout-shell">
    <header class="checkout-header">
      <a class="logo site-logo" href="home.html" aria-label="Ir para a pagina inicial">
        <img src="../../images/logo encurtado.png" alt="Logo E-Commerce Computador">
      </a>
      <button class="mobile-menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="checkout-mobile-menu" data-bs-toggle="collapse" data-bs-target="#checkout-mobile-menu">
        <i class="bi bi-list" aria-hidden="true"></i>
      </button>
      <nav id="checkout-mobile-menu" class="client-nav-menu collapse" aria-label="Menu do cliente">
        <a class="btn nav-action" href="ia.html"><i class="bi bi-stars" aria-hidden="true"></i><span>IA</span></a>
        <div class="header-spacer"></div>
        <button id="perfil-btn" class="btn nav-action" type="button"><i class="bi bi-person-circle" aria-hidden="true"></i><span>Perfil</span></button>
        <button id="btn-carrinho" class="btn nav-action" type="button"><i class="bi bi-cart3" aria-hidden="true"></i><span>Carrinho</span></button>
      </nav>
    </header>

    <div class="checkout-body">
      <section class="checkout-items">
        <h2 class="checkout-title"><i class="bi bi-bag-check" aria-hidden="true"></i><span>Finalizar compra</span></h2>
        <div id="checkout-items-list" class="checkout-items-list"></div>
      </section>

      <aside class="checkout-summary">
        <div class="checkout-panel">
          <h3><i class="bi bi-geo-alt" aria-hidden="true"></i><span>Endereco de entrega</span></h3>
          <div class="field-row">
            <select id="endereco-select" class="form-select"></select>
            <button id="btn-endereco-add" class="btn small" type="button"><i class="bi bi-plus-circle" aria-hidden="true"></i><span>Novo</span></button>
          </div>
          <div id="endereco-info" class="hint"></div>
        </div>

        <div class="checkout-panel">
          <h3><i class="bi bi-credit-card-2-front" aria-hidden="true"></i><span>Cartoes de credito</span></h3>
          <div id="cartao-empty" class="hint hidden">Nenhum cartao cadastrado.</div>
          <div class="field-row">
            <label for="cartao-principal" class="field-label"><i class="bi bi-star" aria-hidden="true"></i><span>Cartao principal</span></label>
            <button id="btn-cartao-add" class="btn small" type="button"><i class="bi bi-plus-circle" aria-hidden="true"></i><span>Novo</span></button>
          </div>
          <div class="field-row stack">
            <select id="cartao-principal" class="form-select"></select>
          </div>
          <div class="field-row">
            <label class="field-label"><i class="bi bi-credit-card" aria-hidden="true"></i><span>Cartoes adicionais</span></label>
            <button id="btn-cartao-extra-add" class="btn small" type="button"><i class="bi bi-plus-circle" aria-hidden="true"></i><span>Adicionar</span></button>
          </div>
          <div id="cartoes-extras-list" class="card-extra-list"></div>
          <div id="cartao-msg" class="hint"></div>
        </div>

        <div class="checkout-panel">
          <h3><i class="bi bi-ticket-perforated" aria-hidden="true"></i><span>Cupom promocional</span></h3>
          <select id="cupom-promo" class="form-select"></select>
          <div id="cupom-promo-msg" class="hint"></div>
        </div>

        <div class="checkout-panel">
          <h3><i class="bi bi-arrow-repeat" aria-hidden="true"></i><span>Cupons de troca</span></h3>
          <div id="cupom-troca-list" class="coupon-list"></div>
        </div>

        <div class="checkout-panel">
          <h3><i class="bi bi-receipt" aria-hidden="true"></i><span>Resumo da compra</span></h3>
          <div id="checkout-totals" class="totals"></div>
        </div>

        <button id="btn-comprar" class="btn summary-btn" type="button"><i class="bi bi-shield-check" aria-hidden="true"></i><span>Comprar</span></button>
      </aside>
    </div>
  </div>

  <div id="endereco-modal" class="modal hidden">
    <div class="modal-content">
      <h3><i class="bi bi-geo-alt" aria-hidden="true"></i><span>Novo endereco</span></h3>
      <div class="modal-grid">
        <select id="end-tipoResidencia" class="form-select"></select>
        <select id="end-tipoLogradouro" class="form-select"></select>
        <input id="end-logradouro" class="form-control" type="text" placeholder="Logradouro">
        <input id="end-numero" class="form-control" type="text" placeholder="Numero">
        <input id="end-bairro" class="form-control" type="text" placeholder="Bairro">
        <input id="end-cep" class="form-control" type="text" placeholder="CEP">
        <input id="end-cidade" class="form-control" type="text" placeholder="Cidade">
        <input id="end-estado" class="form-control" type="text" placeholder="Estado">
        <input id="end-pais" class="form-control" type="text" placeholder="Pais">
        <input id="end-observacoes" class="form-control" type="text" placeholder="Observacoes">
      </div>
      <div class="modal-actions">
        <button id="btn-endereco-cancelar" class="btn small secondary" type="button"><i class="bi bi-x-circle" aria-hidden="true"></i><span>Cancelar</span></button>
        <button id="btn-endereco-salvar" class="btn small" type="button"><i class="bi bi-check2-circle" aria-hidden="true"></i><span>Cadastrar</span></button>
      </div>
      <div id="endereco-modal-msg" class="hint"></div>
    </div>
  </div>

  <div id="cartao-modal" class="modal hidden">
    <div class="modal-content">
      <h3><i class="bi bi-credit-card-2-front" aria-hidden="true"></i><span>Novo cartao</span></h3>
      <div class="modal-grid">
        <select id="modal-cartao-bandeira" class="form-select"></select>
        <input id="modal-cartao-numero" class="form-control" type="text" inputmode="numeric" placeholder="Numero">
        <input id="modal-cartao-nome" class="form-control" type="text" placeholder="Nome impresso">
        <input id="modal-cartao-cvv" class="form-control" type="text" inputmode="numeric" placeholder="CVV">
        <input id="modal-cartao-validade" class="form-control" type="month" placeholder="Validade">
      </div>
      <div class="modal-actions">
        <button id="btn-cartao-cancelar" class="btn small secondary" type="button"><i class="bi bi-x-circle" aria-hidden="true"></i><span>Cancelar</span></button>
        <button id="btn-cartao-salvar" class="btn small" type="button"><i class="bi bi-check2-circle" aria-hidden="true"></i><span>Cadastrar</span></button>
      </div>
      <div id="cartao-modal-msg" class="hint"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../scripts/finalizar.js"></script>
</body>
</html>
