<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../styles/cadastro.css">
</head>
<body>
  <div class="container">
    <aside class="left">
      <a class="brand-panel-logo" href="../index.html" aria-label="Voltar para login">
        <img src="../../images/logo extendido.png" alt="Logo E-Commerce Computador">
      </a>
      <div class="brand-panel-copy">
        <span class="eyebrow"><i class="bi bi-shield-check" aria-hidden="true"></i> Area segura</span>
        <h1>Crie sua conta</h1>
        <p>Cadastre seus dados para comprar componentes, acompanhar pedidos e receber recomendacoes.</p>
      </div>
    </aside>
    <div class="right">
      <div class="cadastro-box">
        <a class="logo site-logo" href="../index.html" aria-label="Voltar para login">
          <img src="../../images/logo encurtado.png" alt="Logo E-Commerce Computador">
        </a>

        <div id="cadastro-message" class="message" role="alert"></div>

        <div id="step-1" class="form-step">
          <div class="input-group">
            <span class="input-group-text" aria-hidden="true"><i class="bi bi-person"></i></span>
            <input class="form-control" type="text" id="nome" placeholder="NOME">
          </div>
          <div class="input-group">
            <span class="input-group-text" aria-hidden="true"><i class="bi bi-card-text"></i></span>
            <input class="form-control" type="text" id="cpf" inputmode="numeric" placeholder="CPF (000.000.000-00)">
          </div>
          <div class="input-group">
            <span class="input-group-text" aria-hidden="true"><i class="bi bi-calendar-event"></i></span>
            <input class="form-control" type="date" id="dataNascimento" placeholder="DATA DE NASCIMENTO">
          </div>

          <select class="form-select" id="genero">
            <option value="MASCULINO">MASCULINO</option>
            <option value="FEMININO">FEMININO</option>
            <option value="OUTRO">OUTRO</option>
          </select>

          <div class="field-row">
            <select class="form-select" id="telefoneTipo">
              <option value="">TIPO TELEFONE</option>
            </select>
            <input class="form-control" type="text" id="telefoneDdd" inputmode="numeric" placeholder="DDD">
          </div>

          <div class="input-group">
            <span class="input-group-text" aria-hidden="true"><i class="bi bi-telephone"></i></span>
            <input class="form-control" type="text" id="telefoneNumero" inputmode="numeric" placeholder="TELEFONE">
          </div>
          <div class="input-group">
            <span class="input-group-text" aria-hidden="true"><i class="bi bi-envelope"></i></span>
            <input class="form-control" type="email" id="email" placeholder="EMAIL">
          </div>
          <div class="input-group">
            <span class="input-group-text" aria-hidden="true"><i class="bi bi-lock"></i></span>
            <input class="form-control" type="password" id="senha" placeholder="SENHA">
          </div>
          <div class="input-group">
            <span class="input-group-text" aria-hidden="true"><i class="bi bi-lock-fill"></i></span>
            <input class="form-control" type="password" id="senhaConfirmar" placeholder="CONFIRMAR SENHA">
          </div>

          <div class="actions">
            <a href="../index.html"><i class="bi bi-box-arrow-in-right" aria-hidden="true"></i><span>JA TEM CONTA?</span></a>
            <button id="btn-next" class="btn btn-primary" type="button" data-icon="bi-arrow-right-circle"><i class="bi bi-arrow-right-circle" aria-hidden="true"></i><span>PROXIMO</span></button>
          </div>
        </div>

        <div id="step-2" class="form-step hidden">
          <div class="section-title"><i class="bi bi-geo-alt" aria-hidden="true"></i><span>ENDERECO</span></div>

          <div class="field-row">
            <input class="form-control" type="text" id="cep" inputmode="numeric" placeholder="CEP">
            <input class="form-control" type="text" id="estado" placeholder="ESTADO">
          </div>

          <input class="form-control" type="text" id="bairro" placeholder="BAIRRO">

          <div class="field-row">
            <select class="form-select" id="tipoLogradouro">
              <option value="">TIPO LOGRADOURO</option>
            </select>
            <select class="form-select" id="tipoResidencia">
              <option value="">TIPO RESIDENCIA</option>
            </select>
          </div>

          <input class="form-control" type="text" id="logradouro" placeholder="RUA">
          <div class="field-row">
            <input class="form-control" type="text" id="numero" inputmode="numeric" placeholder="NUMERO">
            <input class="form-control" type="text" id="pais" placeholder="PAIS" value="Brasil">
          </div>
          <input class="form-control" type="text" id="observacoes" placeholder="COMPLEMENTO">
          <input class="form-control" type="text" id="cidade" placeholder="CIDADE">

          <div class="actions">
            <button id="btn-back" class="btn btn-outline-light" type="button" data-icon="bi-arrow-left-circle"><i class="bi bi-arrow-left-circle" aria-hidden="true"></i><span>VOLTAR</span></button>
            <button id="btn-submit" class="btn btn-primary" type="button" data-icon="bi-check2-circle"><i class="bi bi-check2-circle" aria-hidden="true"></i><span>CADASTRAR</span></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="../scripts/cadastro.js"></script>
</body>
</html>
