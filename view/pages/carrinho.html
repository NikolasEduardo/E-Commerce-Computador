<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrinho</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../styles/carrinho.css">
  <link rel="stylesheet" href="../../styles/mobile-menu.css">
  <link rel="stylesheet" href="../../styles/cart-notice.css">
</head>
<body>
  <div class="cart-shell">
    <header class="cart-header">
      <a class="logo site-logo" href="home.html" aria-label="Ir para a pagina inicial">
        <img src="../../images/logo encurtado.png" alt="Logo E-Commerce Computador">
      </a>
      <button class="mobile-menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="cart-mobile-menu" data-bs-toggle="collapse" data-bs-target="#cart-mobile-menu">
        <i class="bi bi-list" aria-hidden="true"></i>
      </button>
      <nav id="cart-mobile-menu" class="client-nav-menu collapse" aria-label="Menu do cliente">
        <a class="btn nav-action" href="ia.html"><i class="bi bi-stars" aria-hidden="true"></i><span>IA</span></a>
        <div class="header-spacer"></div>
        <button id="perfil-btn" class="btn nav-action" type="button"><i class="bi bi-person-circle" aria-hidden="true"></i><span>Perfil</span></button>
        <button id="btn-carrinho" class="btn nav-action" type="button"><i class="bi bi-cart3" aria-hidden="true"></i><span>Carrinho</span></button>
      </nav>
    </header>

    <h2 class="cart-title"><i class="bi bi-cart-check" aria-hidden="true"></i><span>Carrinho de compras</span></h2>

    <div class="cart-body">
      <section class="cart-items">
        <div id="cart-items-list"></div>
      </section>

      <aside class="cart-summary">
        <h3><i class="bi bi-receipt" aria-hidden="true"></i><span>Detalhes de preco</span></h3>
        <div id="cart-summary-details" class="summary-details"></div>
        <button id="btn-finalizar" class="btn summary-btn" type="button"><i class="bi bi-credit-card" aria-hidden="true"></i><span>Finalizar compra</span></button>
        <button id="btn-continuar" class="btn summary-btn secondary" type="button"><i class="bi bi-arrow-left-circle" aria-hidden="true"></i><span>Continuar comprando</span></button>
      </aside>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../scripts/carrinho.js"></script>
</body>
</html>
